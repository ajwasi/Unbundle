# Deploy from the published image (ghcr.io/ajwasi/unbundle) instead of
# building from source — for a homelab/Portainer host that doesn't have this
# repo checked out. Standalone, not an override fragment layered onto
# docker-compose.yml: Compose can add or replace keys across -f files but
# can't delete one, so an override alone couldn't remove that file's
# `build: .` and reliably force a pull instead.
#
# Usage: copy this file (and .env, based on .env.example) to the target host,
# then `docker compose -f docker-compose.image.yml pull && docker compose
# -f docker-compose.image.yml up -d`. Combine with docker-compose.postgres.yml
# via another -f the same way the main compose file does, for Postgres instead
# of SQLite. That's everything the plain `app` service needs — no other repo
# files required.
#
# The `observability` profile below is the one exception: prometheus/grafana
# still need *some* config file mounted in, and the paths below point at this
# repo's examples/observability/ — either also copy that one directory over,
# or point those two volume lines at your own config instead.
#
# No `demo` profile here — mock-api runs from this same image with a
# different command, but demo mode is a local trial/eval feature, not
# something a real deployment needs; use docker-compose.yml directly (which
# builds) if you want to try demo mode from source.
services:
  app:
    image: ghcr.io/ajwasi/unbundle:latest
    ports:
      - "8010:8000"
    volumes:
      # See docker-compose.yml's own comment on DATA_DIR_HOST: the default
      # "./data" is a real data-loss trap in Portainer specifically, since a
      # redeployed stack's relative paths can resolve against a brand-new
      # internal directory rather than the host path you actually meant —
      # set DATA_DIR_HOST to an absolute host path to avoid it.
      - ${DATA_DIR_HOST:-./data}:/data
      - ${SCAN_ROOT:-./scan-root}:/scan-root:ro
      # To scan more than one location, mount each as its own path here and
      # list all of them (comma-separated, matching these exact container
      # paths) in .env's SCAN_ROOTS — see docker-compose.yml's own copy of
      # this comment and README's "Scanning multiple folders" section.
      # - ${SCAN_ROOT_COMICS:-./scan-root-comics}:/scan-root-comics:ro
    environment:
      - FORWARDED_ALLOW_IPS=*
      # DATABASE_URL/DATA_DIR/DOWNLOADS_DIR: app/config.py's own Settings defaults
      # for these are relative paths meant for local, non-Docker development
      # (e.g. "sqlite:///./data/humble.db", resolving to /app/data/humble.db here
      # — a directory nothing ever creates in this image, only /data does). The
      # Dockerfile itself now also bakes in these same Docker-correct values as
      # image-level ENV defaults (so a deployer's own hand-written compose file,
      # not just this one, gets a working database even if it forgets these) —
      # kept here too as the documented, explicit interface for anyone who wants
      # to override them, and so this file is correct out of the box even with no
      # .env file at all — e.g. a Portainer stack, where env_file's required
      # companion file doesn't exist and setting these instead comes from
      # Portainer's own "Environment variables" UI.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/humble.db}
      - DATA_DIR=${DATA_DIR:-/data}
      - DOWNLOADS_DIR=${DOWNLOADS_DIR:-/data/downloads}
      # No safe default exists for these — bare (no "=value") passes through
      # whatever a real .env file, Portainer's env-vars UI, or the shell already
      # provides, and simply omits the variable entirely (not "set to empty
      # string") if none of those set it, so app/config.py's own insecure-default-
      # plus-loud-startup-warning behavior still applies correctly either way.
      - APP_SECRET_KEY
      - APP_PASSWORD
      - METRICS_TOKEN
      - BEHIND_HTTPS_PROXY
    restart: unless-stopped

  # Same as docker-compose.yml's own observability profile — these are
  # already pulled from Docker Hub, not built from this repo, so nothing
  # about them changes for a no-source deployment.
  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./examples/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./examples/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
