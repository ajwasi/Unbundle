<div id="deals-humble">
  <div class="toolbar">
    <form class="m-0 row" hx-post="/deals/humble/refresh" hx-target="#deals-humble" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <button type="submit" class="secondary">Refresh</button>
      <span class="muted htmx-indicator">Refreshing&hellip;</span>
    </form>
    <span class="muted">
      {% if last_synced %}Last refreshed <span title="{{ last_synced.strftime('%Y-%m-%d %H:%M') }} UTC">{{ last_synced | time_since }}</span>{% else %}Not refreshed yet{% endif %}
    </span>
  </div>
  {% include "home/_bundles.html" %}
</div>
