{% extends "base.html" %}
{% block title %}Steam — Unbundle{% endblock %}
{% block content %}
<h1>Steam Library</h1>

{% if steam_status == "not_configured" %}
<p class="muted">Steam isn't connected yet. Add your API key and SteamID in <a href="/settings">Settings</a>.</p>
{% else %}
<div class="toolbar">
  <form hx-post="/steam/refresh" hx-target="#steam-content" hx-swap="outerHTML" style="margin: 0;">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="secondary">Refresh</button>
  </form>
</div>
{% endif %}

{% include "steam/_content.html" %}
{% endblock %}
