<span id="item-tags-{{ machine_name }}">
  {% for t in tags %}
  <span class="tag-chip">
    {{ t.name }}
    <form hx-post="/catalog/item/{{ machine_name }}/tags/{{ t.id }}/remove" hx-target="#item-tags-{{ machine_name }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <button type="submit" title="Remove tag">&times;</button>
    </form>
  </span>
  {% endfor %}
  <form class="tag-add-form" hx-post="/catalog/item/{{ machine_name }}/tags" hx-target="#item-tags-{{ machine_name }}" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <input type="text" name="name" placeholder="Add tag..." required list="all-tag-names">
    <button type="submit">+</button>
  </form>
</span>
