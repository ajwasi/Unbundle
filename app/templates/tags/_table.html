<div id="tags-table" class="card">
  <div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Bundles</th>
        <th scope="col">Items</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for t in tags %}
      <tr>
        <td>
          <span id="tag-name-view-{{ t.id }}">
            {{ t.name }}
            <button type="button" class="secondary" style="padding: 0.1rem 0.5rem; margin-left: 0.4rem;"
                    onclick="document.getElementById('tag-name-view-{{ t.id }}').style.display = 'none'; document.getElementById('tag-name-form-{{ t.id }}').style.display = 'flex'; document.getElementById('tag-name-input-{{ t.id }}').focus();">Rename</button>
          </span>
          <form id="tag-name-form-{{ t.id }}" hx-post="/tags/{{ t.id }}/rename" hx-target="#tags-table" hx-swap="outerHTML" style="display: none; gap: 0.4rem; max-width: 260px; align-items: center;">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <input type="text" id="tag-name-input-{{ t.id }}" name="name" value="{{ t.name }}" required style="flex: 1;">
            <button type="submit" class="secondary" style="padding: 0.2rem 0.6rem;">Save</button>
            <button type="button" class="secondary" style="padding: 0.2rem 0.6rem;"
                    onclick="var inp = document.getElementById('tag-name-input-{{ t.id }}'); inp.value = inp.defaultValue; document.getElementById('tag-name-form-{{ t.id }}').style.display = 'none'; document.getElementById('tag-name-view-{{ t.id }}').style.display = '';">Cancel</button>
          </form>
        </td>
        <td>{{ t.bundle_count }}</td>
        <td>{{ t.item_count }}</td>
        <td>
          <form hx-post="/tags/{{ t.id }}/delete" hx-target="#tags-table" hx-swap="outerHTML"
                hx-confirm="Delete tag '{{ t.name }}'? This removes it from {{ t.bundle_count }} bundle(s) and {{ t.item_count }} item(s).">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <button type="submit" class="danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">No tags yet — create one above, or add one directly from a bundle or catalog item.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
</div>
