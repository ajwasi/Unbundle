<span id="amazon-music-album-cover-wrap" style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); flex-shrink: 0">
  <img src="/amazon-music/albums/{{ album_key }}/cover{% if cache_bust %}?v={{ cache_bust }}{% endif %}" alt=""
       width="120" height="120" style="border-radius: 6px;" onerror="this.style.opacity='0.25';">
  <form class="m-0" hx-post="/amazon-music/albums/{{ album_key }}/refresh-cover" hx-target="#amazon-music-album-cover-wrap" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="secondary" style="padding: var(--space-0) var(--space-2); font-size: 0.75em"
            title="This image is cached permanently once fetched and never checked again on its own — use this if it looks wrong or out of date.">
      Refresh cover
    </button>
  </form>
</span>
