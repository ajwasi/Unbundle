{% from "_macros.html" import status_badge %}
<p>
  Status:
  {{ status_badge(chirp_status) }}
</p>
{% if chirp_error %}<p class="text-error">{{ chirp_error }}</p>{% endif %}
{% if chirp_connected_as %}<p class="text-success">{{ chirp_connected_as }}</p>{% endif %}

<form hx-post="/settings/chirp" hx-target="#chirp-card-body" hx-swap="innerHTML">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label for="chirp-cookie" class="sr-only">Chirp Cookie header value</label>
  <input id="chirp-cookie" type="password" name="cookie" placeholder="Cookie header value" required style="width: 100%; max-width: 480px;">
  <button type="submit">{{ 'Reconnect' if chirp_status == 'error' else 'Save' }}</button>
  <span class="muted htmx-indicator">Checking your library&hellip;</span>
</form>

{% if chirp_status != 'not_configured' %}
<form hx-post="/settings/chirp/disconnect" hx-target="#chirp-card-body" hx-swap="innerHTML"
      hx-confirm="Disconnect Chirp? This removes the saved cookie." style="margin-top: 0.6rem;">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <button type="submit" class="danger">Disconnect</button>
</form>
{% endif %}
