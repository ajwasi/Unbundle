{% from "_macros.html" import status_badge %}
<p>
  Status:
  {{ status_badge(steam_status) }}
</p>
{% if steam_error %}<p class="text-error">{{ steam_error }}</p>{% endif %}
{% if steam_connected_as %}<p class="text-success">{{ steam_connected_as }}</p>{% endif %}

<form hx-post="/settings/steam" hx-target="#steam-card-body" hx-swap="innerHTML">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <div class="stack stack-form">
    <label>
      API Key {% if steam_has_key %}<span class="muted">(leave blank to keep the saved one)</span>{% endif %}
      <input class="w-full" type="password" name="api_key" placeholder="{{ '••••••••' if steam_has_key else '' }}">
    </label>
    <label>
      SteamID64 or profile URL
      <input class="w-full" type="text" name="steamid" value="{{ steam_id_display }}" placeholder="76561198... or steamcommunity.com/id/yourname">
    </label>
    <button class="self-start" type="submit">{{ 'Reconnect' if steam_status == 'error' else 'Save' }}</button>
  </div>
</form>

{% if steam_status != 'not_configured' %}
<form class="mt-2" hx-post="/settings/steam/disconnect" hx-target="#steam-card-body" hx-swap="innerHTML"
      hx-confirm="Disconnect Steam? This removes the saved API key and SteamID; already-matched ownership data is kept.">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <button type="submit" class="danger">Disconnect</button>
</form>
{% endif %}
