<p>
  Status:
  <span class="badge badge-{{ 'ok' if gog_status == 'ok' else 'error' if gog_status == 'error' else 'not-configured' }}">
    {{ gog_status | replace('_', ' ') }}
  </span>
</p>
{% if gog_error %}<p style="color: var(--error);">{{ gog_error }}</p>{% endif %}

<div class="toolbar" style="justify-content: flex-start;">
  <button type="button" onclick="document.getElementById('gog-login-modal').showModal()">
    {{ 'Reconnect' if gog_status != 'not_configured' else 'Connect' }}
  </button>
  {% if gog_status != 'not_configured' %}
  <form hx-post="/settings/gog/disconnect" hx-target="#gog-modal-content" hx-swap="innerHTML"
        hx-confirm="Disconnect GOG? This removes the saved refresh token; already-matched ownership data is kept." style="margin: 0;">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="secondary">Disconnect</button>
  </form>
  {% endif %}
</div>
