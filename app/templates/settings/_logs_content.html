<div id="logs-content">
  <p class="muted" id="logs-count">Showing {{ log_lines|length }} line(s) (oldest first, newest at the bottom).</p>
  <pre id="logs-pre" style="max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px;">{% for line in log_lines %}<div class="log-line">{{ line }}</div>{% endfor %}</pre>
</div>
