<div id="logs-content">
  <p class="muted">Showing the last {{ log_lines|length }} line(s) (oldest first, newest at the bottom).</p>
  <pre id="logs-pre" style="max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word;">{% for line in log_lines %}{{ line }}
{% endfor %}</pre>
</div>
