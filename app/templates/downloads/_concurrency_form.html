<form hx-post="/downloads/concurrency" hx-target="this" hx-swap="outerHTML" style="display: flex; align-items: center; gap: 0.75rem;">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <label>Run up to <input type="number" name="concurrency" value="{{ concurrency }}" min="1" style="width: 4rem;"> download(s) at once</label>
  <button type="submit">Save</button>
</form>
