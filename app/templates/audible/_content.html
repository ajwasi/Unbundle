<div id="audible-content" aria-live="polite">
  {% if audible_status == "error" %}
  <p class="text-error">{{ audible_error }}</p>
  {% endif %}

  {% if audible_status != "not_configured" %}
  <p class="muted">
    {{ book_count }} book(s) owned &mdash; {{ total_runtime_hours }} hour(s) total runtime.
  </p>

  <div class="card">
    <h2>Owned Books ({{ book_count }})</h2>
    {% include "audible/_books_table.html" %}
  </div>
  {% endif %}
</div>
