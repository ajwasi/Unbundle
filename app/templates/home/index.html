{% extends "base.html" %}
{% block title %}Home — Humble Tracker{% endblock %}
{% block content %}
<h1>Currently for Sale</h1>
<div class="toolbar">
  <form hx-post="/storefront/refresh" hx-target="#storefront-bundles" hx-swap="outerHTML" style="margin: 0; display: flex; gap: 0.75rem; align-items: center;">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="secondary">Refresh</button>
    <span class="muted htmx-indicator">Refreshing&hellip;</span>
  </form>
</div>

{% include "home/_bundles.html" %}
{% endblock %}
