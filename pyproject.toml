[project]
name = "humble-tracker"
version = "0.1.0"
description = "Self-hosted web UI + download/location tracker for humble-cli"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "nh3>=0.2",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# psycopg3, not psycopg2 (SQLAlchemy 2.0's actively-recommended modern driver).
# [binary] vendors a statically-linked libpq in the wheel, so no apt-get
# libpq-dev/postgresql-client is needed anywhere this installs (Dockerfile or
# a plain local `pip install`). DSN scheme must be postgresql+psycopg://
# (bare postgresql:// resolves to psycopg2 by default, which isn't installed).
postgres = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
