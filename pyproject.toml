[project]
name = "unbundle"
version = "0.1.0"
description = "Self-hosted web UI + download/location tracker for humble-cli"
requires-python = ">=3.11"
# AGPL, not a plain permissive license, specifically because the Audible
# connector imports the `audible` package (mkb79/Audible), itself AGPL-3.0 —
# see LICENSE. That's a real constraint from a direct runtime dependency,
# not a preference.
license = { text = "AGPL-3.0-or-later" }
# Exact pins (==), not lower bounds — a `docker build` run today vs. six
# months from now must resolve to the exact same versions, so a compromised
# or newly-vulnerable transitive release never gets silently pulled into a
# fresh image. Every version below is the one this exact codebase's full test
# suite has actually passed against; bumping any of these is a deliberate
# action (re-run the full suite, update the pin here), not something that
# happens automatically on the next build.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "pydantic-settings==2.16.3",
    "itsdangerous==2.2.0",
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "authlib==1.9.10",
    "audible==0.13.1",
    "nh3==0.3.8",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-prometheus==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "playwright==1.65.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
]
# psycopg3, not psycopg2 (SQLAlchemy 2.0's actively-recommended modern driver).
# [binary] vendors a statically-linked libpq in the wheel, so no apt-get
# libpq-dev/postgresql-client is needed anywhere this installs (Dockerfile or
# a plain local `pip install`). DSN scheme must be postgresql+psycopg://
# (bare postgresql:// resolves to psycopg2 by default, which isn't installed).
postgres = [
    "psycopg[binary]==3.3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
# F: pyflakes (unused/undefined names). E9: syntax errors. BLE: blind `except
# Exception` — this app has many deliberate "never crash the page" boundaries,
# so each one carries a `# noqa: BLE001 - <why>` rather than going unmarked.
select = ["F", "E9", "BLE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
