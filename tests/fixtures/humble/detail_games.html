 as much as $283. Here at Humble Bundle, you choose the price and increase your contribution to upgrade your bundle! This bundle has a minimum $5 purchase. Pay $5 or more to access Steam keys.</p>\n<p><strong>Redeem on Steam.</strong> All of the games in this bundle are available on Steam for Windows \u2014 and some for Mac too.<br><br>Please review the system requirements&nbsp;<a href=\"https://support.humblebundle.com/hc/en-us/articles/57550496985627-Marmalade-Games-Ultimate-Digital-Board-Game-Night-System-Requirements\" title=\"Marmalade Games: Ultimate Digital Board Game Night - System Requirements\">here</a>&nbsp;prior to purchasing.<br><br><strong>Support charity.</strong> Choose where the money goes - between the developer and to support Little Village. If you like what we do, you can leave us a Humble Tip too!</p>\n70:T4e9,Check out our new game and discover new ways to win, in <a href=\"../../../../store/the-game-of-life-2\"> <i>THE GAME OF LIFE</i> 2</a>\u00a0! Get more choices and more freedom in the official contemporary sequel to the game you love. <strong class=\"hmb\"> <br><br>Where will your choices take you? Find out in <i>THE GAME OF LIFE</i>! </strong> <br><i> <i>THE GAME OF LIFE</i>! </i> showcases a beautifully rendered digital game board, cards and spinner that capture the fun of the Classic game full of adventure & surprises! <i>THE GAME OF LIFE</i> will take players on a journey where fortunes can be won\u2026and lost! Choose a college or career path and start down the many roads of life, make money, buy a house or start a family -- will you take the safe route or the risky road? The choice is yours as you navigate life\u2019s rich tapestry! Do whatever it takes to retire in style with the most wealth at the end of the game to win! <br><br><br>\n<ul>\n<li>Multiple game modes for 1-4 players, including new, fast-play modes and single player mode </li>\n<li>Save and resume in-progress games </li>\n<li>Options enable game to be fully playable in English, French, Italian, Portuguese, Spanish, German, Russian, Traditional Chinese or Simplified Chinese.</li>\n</ul>\n71:T911,<strong>\n You sank my battleship!\n</strong>\n<br>\n<br>\nThe official version of the classic Hasbro board game of naval combat is now on Steam! Challenge other players in Classic Mode or in the all-new Commanders Mode - a fast-paced, strategic and exciting variation. Play with unique naval commanders and use resources to activate powerful special abilities that will secure you a win as you wage war on the high seas.\n<br>\n<br>\n<br>\n<strong>\n <i>Hasbro's BATTLESHIP</i>\n</strong>\nfeatures:\n<strong>\n <br>\n <br>\n CLASSIC MODE\n</strong>\n<br>\n<ul>\n <li>\n  Faithful conversion of the classic board game\n  <br>\n </li>\n <li>\n  Head-to-head combat\n  <br>\n </li>\n <li>\n  Sink your opponent\u2019s fleet before they sink yours\n  <br>\n </li>\n <li>\n  Call your shot and fire!\n </li>\n</ul>\n<br>\n<strong>\n COMMANDERS MODE\n</strong>\n<br>\n<ul>\n <li>\n  Battleship with a twist!\n  <br>\n </li>\n <li>\n  A brand new, more tactical variation of the game\n  <br>\n </li>\n <li>\n  3 new core abilities that shake up the strategic possibilities each turn\n  <br>\n </li>\n <li>\n  Unique special abilities for each Commander\n  <br>\n </li>\n <li>\n  New ship shapes to improve game play and the fun factor\n </li>\n</ul>\n<br>\n<strong>\n COMMANDERS\n</strong>\n<br>\n<ul>\n <li>\n  Battle with commanders from throughout the ages\n </li>\n</ul>\n<br>\n<strong>\n FLEETS\n</strong>\n<br>\n<ul>\n <li>\n  Each commander\u2019s fleets feature unique and authentic art for each of the many warships! Watch as they come together in an epic clash of civilizations!\n </li>\n</ul>\n<br>\n<strong>\n ARENAS\n</strong>\n<br>\n<ul>\n <li>\n  Deploy your fleet to every corner of the world and battle in epic arenas inspired by historical naval battles!\n </li>\n</ul>\n<br>\n<strong>\n MISSIONS AND RANKS\n</strong>\n<br>\n<ul>\n <li>\n  Complete missions to earn medals, rank up and become the ultimate commander of the fleet!\n </li>\n</ul>\n<br>\n<strong>\n SINGLE PLAYER\n</strong>\n<br>\n<ul>\n <li>\n  Battle against AI Commanders and raise your game before heading into multiplayer!\n </li>\n</ul>\n<br>\n<strong>\n MULTIPLAYER\n</strong>\n<br>\n<ul>\n <li>\n  Take on a world of commanders all battling to have the last fleet standing and prove that you have what it takes to conquer the oceans!\n </li>\n</ul>\n<br>\nJoin us in\n<strong>\n <i>Hasbro's BATTLESHIP</i>\n</strong>\nnow, and set sail for adventure, battle and glory!\n\n72:Tea4,<br><i>THE GAME OF LIFE 2</i> is here on Steam (PC)! This digital board game is an official, contemporary sequel to the classic THE GAME OF LIFE game. It offers more choices and more freedom at every stage of the game on a fully animated and immersive 3D board. You\u2019ve got thousands of new, meaningful ways to live your life before reaching the finish line. <br><br><i>THE GAME OF LIFE 2</i> is another one of Marmalade Game Studio\u2019s classic board games for kids and adults alike. <strong class=\"hmb\"> <br><br>Features </strong> <br>\n<ul>\n<li>A CONTEMPORARY SEQUEL TO HASBRO\u2019S CLASSIC BOARD GAME - <i>THE GAME OF LIFE 2</i> drives the original from yesterday to today, with:</li>\n<li>Customisable pegs</li>\n<li>A selection of vehicles</li>\n<li>An eco-city board</li>\n<li>Second chances, including the option to change job, go back to school and get married later</li>\n<li>New careers, including Video Blogger, Game Designer, Athlete and Dog Groomer</li>\n<li>Pet adoption</li>\n<li>New ways to win, including points for knowledge and happiness, as well as wealth</li>\n<li>The chance to continue playing past retirement</li>\n</ul>\n<ul>\n<li>OPEN ONLINE MULTIPLAYER - Distance doesn\u2019t interrupt play when you connect with up to 4 players around the world</li>\n<li>PRIVATE ONLINE MULTIPLAYER - Invite up to 4 friends and/or family members to a private multiplayer game</li>\n<li>CROSS-PLATFORM MULTIPLAYER - Play on Steam, against friends on their phones!</li>\n<li>SINGLE PLAYER - There\u2019s no such thing as playing alone when you take on our challenging AI</li>\n<li>PASS &amp; PLAY - Simply pass the keyboard and/or mouse between players for an easy offline experience</li>\n<li>SEASON PASS - Seek out additional boards, including \u2018Fairytale Kingdom\u2019, \u2018Haunted Hills\u2019 and 'Frozen Lands' with <i>THE GAME OF LIFE 2</i> Season Pass to unlock themes, with 7 more on the way! <strong class=\"hmb\"> <br><br>How to play</strong><br><br><strong> CHOOSE and CUSTOMISE your character! </strong> <br>A life journey calls for one jaw-dropping outfit! Customise your pink, blue or purple peg with a style all of their own. <br><br><strong> START at the beginning! </strong> <br>Teen life on the board might seem daunting, but there\u2019s no pressure! <i>THE GAME OF LIFE 2</i> game starts when big decisions really begin, and the choices just keep coming!<br><br><strong> Choose your LIFE PATH! </strong> <br>Your life is in your hands! Get married, earn qualifications, become a star and adopt pets. In <i>THE GAME OF LIFE 2</i> game the road has many twists and turns, and crossroads can now grant second chances - so it\u2019s never too late to get married or earn that degree! <br><br><strong> Money vs Happiness, RETIRE your way! </strong> <br>Are you in it for the millions or the good times? <i>THE GAME OF LIFE 2</i> game is about so much more than money. Gain attributes for happiness, wealth and knowledge, and the final score will sum up your achievements! <br><br><strong> Earn REWARDS to UNLOCK new items! </strong> <br>Unlock new characters, outfits and vehicles by playing the game and earning rewards! Collect 60 happiness points, travel 100 spaces, collect 5000k; each accomplishment unlocks a puzzle piece. When you collect 6 puzzle pieces you can unlock a bonus item, and there are eight to unlock in each world! <br><br><strong> EXPLORE marvellous worlds with <i>THE GAME OF LIFE 2</i> Season Pass! </strong> <br>Take an enchanted quest through the Fairytale Kingdom, become a Monster Herder in the Haunted Hills, discover the magic of Frozen Lands and live the life of your dinosaur-loving dreams in Age of Giants! <i>THE GAME OF LIFE 2</i> Season Pass includes 4 additional worlds\u2026 <br><br>...with more worlds coming soon!</li>\n</ul>\n73:T598,If you already have THE GAME OF LIFE 2 game, this is your chance to get all additional worlds, including: <br><br>\n<ul>\n<li>FAIRYTALE KINGDOM -Take an enchanted quest through the \u2018Fairytale Kingdom\u2019. Study at the Wizard Academy or become a Knight in shining armour! </li>\n<li>HAUNTED HILLS - Will you test your tasty brains at the Haunted College, or go straight into a ghoulish profession? The choice is yours! </li>\n<li>FROZEN LANDS - Get in your sleigh and qualify as an Arctic Scientist, or hit the slopes as a professional Snow Sledder! A sparkling snowy landscape awaits! </li>\n<li>AGE OF GIANTS - Experience a fantasy prehistoric land where pegs and dinosaurs live in perfect harmony. Survive life as a Dino Dentist, or speed from home to home as a Raptor Postman. New prehistoric choices await!! </li>\n<li>SANDY SHORES - Go on a forever holiday to an island where the sun never sets and the skies are always blue. Ride the waves as a Surf Instructor, or dive beneath them as a Marine Biologist. </li>\n<li>LUNAR AGE - Launch into orbit and build a new life on the furthest frontier! Become a Spaceport Operator, or graduate from the Lunar Academy and be a Blackhole Explorer. </li>\n<li>SWEET HAVEN - Float into a land of sugar and cheer and get ready to dedicate your life to the art of candy-craft! </li>\n<li>All CURRENT AND FUTURE themes, outfits, vehicles and avatars!</li>\n</ul>\nPlay now with your friends and family!\n7a:T978,Experience a fresh take on the classic crime-solving board game. Step into new mysteries and use your skills of deduction to find out who? With what weapon? Where? Join fellow detectives all over the world. Gather crucial evidence, interrogate suspects, and solve the original murder mystery. <br><br>Follow your suspects through the iconic Tudor Mansion, unlocking their motives and alibis as you go. Play by the original rules, or try a new investigation format available exclusively to Cluedo. Face your suspects in a direct interrogation as you rely on your skills of deduction to get to the truth. Experience the mystery, solve the murder your way and become the detective you want to be! <br><br>The complete ad-free original board game in stunning fully animated 3D. It\u2019s the most iconic murder mystery of all time! <br><br>A <i>Clue/Cluedo</i> exclusive for crime enthusiasts - interrogate multiple suspects at once and run your investigation with more freedom and creativity than ever before! <br><br>Unlock layers of backstory, revealing information about the characters, their motives and alibis. Unlock every clue and earn bonus items, including premium dice and tokens! <br><br>The latest standard gameplay from Hasbro: when you roll a magnifying glass, draw a Clue Card and get free movement to any room, the chance to ask fellow suspects to reveal a card, and more! <br><br>Challenge AI detectives. Alter difficulty levels and tailor your investigation.<br><br>Join detectives around the world to interrogate suspects, gather evidence and solve the mystery.<br><br>Interrogate your friends, cross-examine your family, and unravel the truth. <br><br>For local multiplayer mode, download the free Cluedo Companion app to keep your Cluesheet secret! <br><br>What happens after Tudor Mansion? Find out in this NEW Crime Scene. How did every suspect come to be at the same resort at the same time? And who murdered Callan Coral?! There\u2019s a storm approaching, and in the tropical heat a new mystery is unfolding. <br><br>WHISPERING PINES RETREAT <br>In another reality, six familiar figures receive invitations to an exclusive, luxury wellness resort. But one of them has manifested a murder! Figure out which guest murdered Mr. Bodden \u201cBoddy\u201d Black in this brand-new tale of blackmail and corruption set amidst a tranquil forest.<br><br>New Crime Scenes are coming, including Suspects, Case Files and more!\n7b:T5cf,<p>The shadows over Hue County grow darker in the wake of a shocking murder.</p>\n<p>Step into the elegant Noir Mansion and interrogate six suspects too sharp for their own good. They'll point fingers in every direction and offer up promises of honesty.</p>\n<p>But you know better. Trust nothing but your clue sheet...</p>\n<p>Could it have been Crime Reporter Scarlett with the Mini Revolver? Maybe Private Detective Mustard used the \"Civil War\" Musket with Bayonet? Did Risk Analyst Plum turn himself into a liability with the Billiard Stick, or perhaps Lawyer Peacock cracked with the Meat Tenderiser. Did Signature Forger White sign off Boddy's death with the Silver Candelabra? Or maybe Con Artist Green phoned in a deadly performance with the Rotary Phone...</p>\n<p>With the Noir Mansion expansion, you can toggle the special Noir filter at any time during your game! See the mansion in its full-colour glory, or drench it in deep, cinematic shadows.</p>\n<p>You'll also unlock Noir-themed cosmetics to dress up in true vintage style!</p>\n<p><strong class=\"hmb\">INCLUDES:</strong></p>\n<ul>\n<li>\n<p>A BRAND-NEW EXPANSION \u2013 The highly requested film-noir theme arrives in Clue/Cluedo!</p>\n</li>\n<li>\n<p>THEMED COSMETICS \u2013 This expansion includes a new player avatar, a different card back, a themed clue sheet, a sleek dice set and 12 new tokens.</p>\n</li>\n<li>\n<p>MORE STORY TO EXPLORE \u2013 Delve into the murky backstories of each suspect and uncover their motives.</p>\n</li>\n</ul>"])</script></body></html>
