ccessful in driving and supporting cloud adoption within their organizations and for their clients. You also get access to the superior Sybex online learning environment and text bank, including practice test questions, flashcards, and glossary.</p>\",\"developers\":[{\"name\":\"Boyce\",\"url\":\"https://www.wiley.com/en-us\"}],\"publishers\":[{\"name\":\"Wiley\",\"url\":\"https://www.wiley.com/en-us/Electric+Cars+For+Dummies-p-9781119886198\"}],\"deliveryMethods\":[\"download\"],\"platforms\":[\"pdf\",\"epub\"],\"bundleType\":\"books\",\"updatedAt\":\"2026-11-11T03:17:58+00:00\",\"createdAt\":\"2026-11-04T17:09:51+00:00\",\"msrp\":\"$undefined\",\"msrpEntries\":\"$undefined\",\"reviewScore\":null},{\"id\":\"27ff87c1-fe2d-4417-8d2b-df400d8ad7a6\",\"key\":\"securingtheawscloud_aguideforlearningtosecureawsinfrastructure_certificationsandsecurityforcloudanddevopswiley_bookbundle\",\"title\":\"Securing the AWS Cloud: A Guide for Learning to Secure AWS Infrastructure\",\"thumbnailImageUrl\":\"https://hb-prd.imgix.net/product-media/c208af99c5d26a37a08dd5fffd13a1807a299af2.png\",\"description\":\"$74\",\"developers\":[{\"name\":\"Carroll\",\"url\":\"https://www.wiley.com/en-us\"}],\"publishers\":[{\"name\":\"Wiley\",\"url\":\"https://www.wiley.com/en-us/Electric+Cars+For+Dummies-p-9781119886198\"}],\"deliveryMethods\":[\"download\"],\"platforms\":[\"pdf\",\"epub\"],\"bundleType\":\"books\",\"updatedAt\":\"2026-11-11T03:17:56+00:00\",\"createdAt\":\"2026-11-04T17:09:51+00:00\",\"msrp\":\"$undefined\",\"msrpEntries\":\"$undefined\",\"reviewScore\":null}],\"price\":{\"amount\":25,\"currencyCode\":\"USD\"},\"totalMsrpValue\":\"$undefined\",\"redeemableItems\":[]}],\"createdAt\":\"2026-10-30T23:09:01.536Z\",\"updatedAt\":\"2026-11-11T03:18:08.967Z\",\"taxCategory\":\"ebook\",\"productType\":\"bundle\",\"redeemableItems\":[],\"isAvailableInThisCountry\":true,\"totalItems\":20,\"purchaseLimit\":8}}]}]]\n6f:T584,<p><strong>Ace your Cloud and DevOps exams!</strong> Don\u2019t stress that upcoming test; get the expert-level prep courses you need to dominate your certifications and cloud and DevOps security with our latest bundle from the industry leaders at Wiley! Ace your AWS, Google Cloud, and Azure certifications with this curated 20-course library of practice exams and supplemental materials. Plus, your purchase includes the <em>MC Microsoft Certified Azure Fundamentals Study Guide: Exam AZ-900, 2nd Edition</em>. Pay what you want for elite learning and help support First Book with your purchase!</p>\n<p><strong>Pay $5 or more.</strong> Normally, the total cost for the ebooks in this bundle is as much as $990. Here at Humble Bundle, you choose the price and increase your contribution to upgrade your bundle! This bundle has a minimum $5 purchase.</p>\n<p><strong>Read them anywhere.</strong> The ebooks in this bundle are available in PDF and ePub formats, so they work on your computer, e-readers, iPads, cell phones, and a wide array of mobile devices! Instructions and a list of recommended reading programs can be found <a href=\"https://support.humblebundle.com/hc/articles/202712300\" rel=\"noopener\" target=\"_blank\">here</a>.</p>\n<p><strong>Support charity.</strong> Choose where the money goes - between the publisher and to support First Book. If you like what we do, you can leave us a Humble Tip too!</p>\n70:T74c,<p>The Illustrated AWS Cloud: A Guide to Help You on Your Cloud Practitioner Journey presents AWS Cloud concepts in a highly visual and entertaining way, and organizes topics like those covered in our bestselling AWS Certified Cloud Practitioner Study Guide: Foundational (CLF-C01) Exam. By providing Bre learning about basic AWS Cloud concepts.\u00a0 Focusing on the job role and responsibilities of an AWS Cloud Practitioner, the book guides readers through choosing the best AWS Cloud services to match specific use cases. After a brief introduction to the major categories of services, the book illustrates:\u00a0 \u00a0\u00a0\u00a0\u00a0 Cloud Concepts\u00a0 Security and Compliance\u00a0 Technology\u00a0 Billing and Pricing\u00a0\u00a0\u00a0 \u00a0\u00a0 This is an ideal book for those people who want a visual introduction to AWS Cloud and are considering a career as a cloud administrator or technical support person. An AWS Certified Cloud Practitioner is an individual who can effectively demonstrate an overall knowledge of the AWS Cloud, independent of a specific job role. The person should be able explain the value of the AWS Cloud; understand and explain the AWS shared responsibility model; understand security best practices; understand AWS Cloud costs, economics, and billing practices; describe and position the core AWS services, including compute, network, databases, and storage; and identify AWS services for common use cases. A qualified AWS Cloud Practitioner should have 6 months, or the equivalent, of active engagement with the AWS Cloud, with exposure to AWS Cloud design, implementation, and/or operations. The person should also be able to demonstrate an understanding of well-designed AWS Cloud solutions and have the knowledge of AWS Cloud concepts; security and compliance within the AWS Cloud; understanding of the core AWS services; understanding of the economics of the AWS Cloud.</p>\n71:T640,<p>CompTIA Cloud+ Study Guide: Exam CV0-004, Fourth Edition, introduces you to the job role and responsibilities of working as a Cloud systems administrator, and also prepares you for taking the UPDATED CompTIA Cloud+ Exam CV0-004 exam. This Study Guide is the ideal resource to help you earn this challenging, but rewarding certification, especially if you're\u00a0looking to advance your career as a cloud administrator. The book focuses on cloud computing infrastructure and administration.\u00a0Topics include:\u00a0\u00a0\u00a0 Cloud Architecture\u00a0 Deployment\u00a0 Operations\u00a0 Security\u00a0 DevOps Fundamentals\u00a0 Troubleshooting\u00a0\u00a0\u00a0 Cloud computing can be defined as computing as a service rather than a product. At its basic level, shared resources, software, and information are provided to computers and other devices as a utility over a shared network.\u00a0The CompTIA Cloud+ certification exam verifies you have the knowledge and skills required to\u00a0understand cloud architecture and design concepts; implement and maintain a secure cloud environment; successfully provision and configure cloud resources; demonstrate the ability to manage operations throughout the cloud environment life cycle, using observability, scaling, and automation; understand fundamental DevOps concepts related to deployment and integration; and troubleshoot common issues related to cloud management.\u00a0 The Sudy Guide provides you with one year of free access after activation to Sybex's superior online interactive learning environment and test bank, including practice questions, electronic flashcards, and a glossary of key terms.</p>\n72:T53b,<p>Beginning Azure DevOps: Planning, Building, Testing and Releasing Software Applications on Azure\u00a0helps\u00a0any beginner seeking to learn about Azure DevOps and how to apply different services to their software development projects. This book covers all the built-in Azure DevOps tools needed to plan, build, test, and ship applications for project management, version control, testing, and continuous integration and continuous delivery (CI/CD). Throughout this book, you will discover how to plan software development projects using Agile and Scrum techniques and then learn about version control, build and release pipelines, testing strategies, infrastructure as code techniques and artifacts.\u00a0 Topics in this book include:\u00a0\u00a0\u00a0 Managing an Azure DevOps Project with Azure Boards\u00a0 Source Control Management with Azure Repos\u00a0 Software Testing\u00a0 Automating Code Builds and Releases with Azure Pipelines\u00a0 Infrastructure Automation with Azure Bicep\u00a0 Packaging Code with Azure Artifacts\u00a0\u00a0\u00a0 The book also provides source code for practice exercises. The author plans to update the source code on GitHub for you to clone and import into your Azure DevOps projects. (GitHub is one of the DevOps services that helps to increase collaboration, automate your code-to-cloud workflows, and secure your code with advanced capabilities.)</p>\n74:T71b,<p>Securing the AWS Cloud: A Guide for Learning to Secure AWS Infrastructure is a practical hands-on resource thats designed to empower you with foundational security knowledge and help you apply your skills to the Amazon Web Services (AWS) cloud environment. The book guides you from understanding basic online security principles to mastering advanced AWS cloud security techniques. Topics include:\u00a0\u00a0\u00a0\u00a0 Identity and Access Management\u00a0 Infrastructure Protection\u00a0 Threat Detection and Management\u00a0 Data Security and Cryptography\u00a0 Monitoring, Logging, and Compliance\u00a0 Resilience and Recovery Strategies\u00a0 Security Operations and Automation Securing the AWS Cloud stands out by offering a step-by-step approach to cloud security, making it accessible and actionable for you.\u00a0\u00a0\u00a0 It begins with fundamental concepts of cybersecurity, gradually progressing to more sophisticated AWS security practices. The approach is designed so that you can build on your existing knowledge and apply it effectively to the AWS cloud. The book addresses common challenges such as understanding the complexity of cloud security and the need for clear, straightforward guidance. It equips you with the knowledge and skills necessary to implement security measures in AWS infrastructure and enhance your employability and value in the workforce. The demand for skilled cloud security professionals is on the rise as more organizations transition to cloud computing. The book addresses this need by explaining cloud security concepts and offering practical, real-world strategies for protecting cloud-based resources. By focusing on applied knowledge and skill development, this book prepares you to do the securing of AWS environments, making it a valuable resource for you as you look to advance their career in cloud security</p>"])</script></body></html>
