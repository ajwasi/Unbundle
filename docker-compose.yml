services:
  app:
    build: .
    ports:
      - "8010:8000"
    volumes:
      # Everything that makes this app stateful lives under here — the database,
      # the auto-generated .secret_key, backups, and staged downloads. The
      # default "./data" is relative to wherever `docker compose` is invoked
      # from, which is fine for a plain compose CLI deployment, but is a real
      # data-loss trap in Portainer: a stack's relative paths resolve against
      # Portainer's own internal stack directory, not a stable host path, so
      # redeploying (not just updating the image tag) can silently point this
      # at a brand-new empty folder — everything looks reset to a fresh
      # install. Set DATA_DIR_HOST to an absolute host path (e.g.
      # /volume1/docker/unbundle/data on a Synology) to avoid this entirely.
      - ${DATA_DIR_HOST:-./data}:/data
      # Folder-scan (Downloads page) can only ever see this mount and its
      # subdirectories — never an arbitrary host path. Point SCAN_ROOT at
      # wherever your existing library actually lives; read-only since
      # scanning only ever reads filenames/sizes, never writes here.
      - ${SCAN_ROOT:-./scan-root}:/scan-root:ro
      # To scan more than one location (e.g. separate shares that can't share
      # a common parent directory), mount each as its own path here — name it
      # meaningfully, it becomes that root's label on the scan form — and
      # list all of them (comma-separated, matching these exact container
      # paths) in .env's SCAN_ROOTS. See README's "Scanning multiple
      # folders" section. Example:
      # - ${SCAN_ROOT_COMICS:-./scan-root-comics}:/scan-root-comics:ro
    environment:
      # Trusts X-Forwarded-* from anywhere on the Compose network — safe *because*
      # the accompanying guidance (README's "Reverse proxy / HTTPS" section) is to
      # stop publishing the "ports" mapping above once a reverse proxy is in front
      # of this app, so nothing else can reach it directly to spoof these headers.
      # Not an app Settings field (uvicorn reads this env var directly), so it's
      # set here rather than in .env.example.
      - FORWARDED_ALLOW_IPS=*
      # DATABASE_URL/DATA_DIR/DOWNLOADS_DIR: app/config.py's own Settings defaults
      # for these are relative paths meant for local, non-Docker development
      # (e.g. "sqlite:///./data/humble.db", resolving to /app/data/humble.db here
      # — a directory nothing ever creates in this image, only /data does). Baked
      # in directly here rather than left to .env alone, so the container is
      # correct out of the box even with no .env file at all — e.g. a Portainer
      # stack, where env_file's required companion file doesn't exist and setting
      # these instead comes from Portainer's own "Environment variables" UI.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/humble.db}
      - DATA_DIR=${DATA_DIR:-/data}
      - DOWNLOADS_DIR=${DOWNLOADS_DIR:-/data/downloads}
      # No safe default exists for these two — bare (no "=value") passes through
      # whatever a real .env file, Portainer's env-vars UI, or the shell already
      # provides, and simply omits the variable entirely (not "set to empty
      # string") if none of those set it, so app/config.py's own insecure-default-
      # plus-loud-startup-warning behavior still applies correctly either way.
      - APP_SECRET_KEY
      - APP_PASSWORD
      # Opt-in (default off) — see the "demo" profile below and README's "Try it
      # without connecting accounts" section. Only takes effect combined with
      # `--profile demo`; harmless if set without it (mock-api just won't exist).
      - DEMO_MODE=${DEMO_MODE:-false}
      - MOCK_API_BASE_URL=${MOCK_API_BASE_URL:-http://mock-api:8090}
      # Both optional, no safe non-empty default — same bare passthrough as the
      # secrets above.
      - METRICS_TOKEN
      - BEHIND_HTTPS_PROXY
    restart: unless-stopped

  # A fake Humble/Steam/GOG backend serving a curated, privacy-scrubbed subset of
  # real library data (see mock_api/, scripts/generate_mock_data.py) — lets the
  # app be explored fully populated without connecting any real account. Reuses
  # the same built image as `app`, just runs a different process. Never exposed
  # to the host (no "ports") — only `app` can reach it, over the compose network,
  # and only once DEMO_MODE=true actually points the connectors at it.
  mock-api:
    build: .
    profiles: ["demo"]
    command: ["python", "-m", "mock_api.main"]
    restart: unless-stopped

  # Both behind the "observability" profile — `docker compose up` alone never
  # starts these; `docker compose --profile observability up` does. See the
  # README's Observability section.
  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./examples/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./examples/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
