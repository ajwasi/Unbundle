services:
  app:
    build: .
    ports:
      - "8010:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      # Trusts X-Forwarded-* from anywhere on the Compose network — safe *because*
      # the accompanying guidance (README's "Reverse proxy / HTTPS" section) is to
      # stop publishing the "ports" mapping above once a reverse proxy is in front
      # of this app, so nothing else can reach it directly to spoof these headers.
      # Not an app Settings field (uvicorn reads this env var directly), so it's
      # set here rather than in .env.example.
      - FORWARDED_ALLOW_IPS=*
      # Opt-in (default off) — see the "demo" profile below and README's "Try it
      # without connecting accounts" section. Only takes effect combined with
      # `--profile demo`; harmless if set without it (mock-api just won't exist).
      - DEMO_MODE=${DEMO_MODE:-false}
    restart: unless-stopped

  # A fake Humble/Steam/GOG backend serving a curated, privacy-scrubbed subset of
  # real library data (see mock_api/, scripts/generate_mock_data.py) — lets the
  # app be explored fully populated without connecting any real account. Reuses
  # the same built image as `app`, just runs a different process. Never exposed
  # to the host (no "ports") — only `app` can reach it, over the compose network,
  # and only once DEMO_MODE=true actually points the connectors at it.
  mock-api:
    build: .
    profiles: ["demo"]
    command: ["python", "-m", "mock_api.main"]
    restart: unless-stopped

  # Both behind the "observability" profile — `docker compose up` alone never
  # starts these; `docker compose --profile observability up` does. See the
  # README's Observability section.
  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./examples/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./examples/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
