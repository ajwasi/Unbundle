# For a bare nginx + certbot setup. If you're already using something like Nginx
# Proxy Manager, Synology's own reverse proxy, or Traefik, TLS termination is
# already handled for you — the part that actually matters for this app is the
# proxy_set_header lines below (X-Forwarded-Proto in particular; without it the
# app can't tell it's being reached over HTTPS). See the README's "Reverse proxy
# / HTTPS" section for the accompanying app-side settings (BEHIND_HTTPS_PROXY=true,
# FORWARDED_ALLOW_IPS) and for why the app's own "ports" mapping should be removed
# once a reverse proxy is in front of it.

server {
    listen 443 ssl;
    server_name humble.example.com;

    ssl_certificate     /etc/letsencrypt/live/humble.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humble.example.com/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    server_name humble.example.com;
    return 301 https://$host$request_uri;
}
