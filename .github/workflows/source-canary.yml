name: Source canary

# The normal suite makes no network calls, so it can't notice when an external
# site changes its markup. This weekly run does: it fetches the real Humble
# Bundle storefront and checks it still parses (tests/test_storefront_live.py).
# A red run here means "re-record the fixtures and fix the parser" — see
# scripts/record_humble_fixtures.py — before users hit a broken Home page.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check the live storefront still parses
        env:
          RUN_LIVE_TESTS: "1"
        run: pytest tests/test_storefront_live.py -v
