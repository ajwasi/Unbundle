name: Publish Docker image

# Runs only on a version tag (e.g. v1.2.3) — pushes to main don't trigger a
# build, so a release is a deliberate, one-time action rather than every
# commit landing in ghcr.io. First run also creates the ghcr.io package
# itself; see README's release section for the one-time step needed after
# that to make it pullable without authentication.
on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: ghcr.io/ajwasi/unbundle

permissions:
  contents: read
  packages: write

jobs:
  # Gates the publish below on the real test suite — a tag whose tests fail
  # must never reach ghcr.io as a taggable release. No other CI exists in
  # this repo yet, so this doubles as the only place the suite runs at all.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12" # matches the Dockerfile's base image

      - name: Install dependencies
        run: pip install -e ".[dev]" # SQLite only — the suite never touches Postgres, see conftest.py

      - name: Run tests
        run: pytest -n auto

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags), not the default shallow clone —
      # the Dockerfile's own version stage runs `git describe --tags
      # --exact-match HEAD` to bake the exact release tag into the image
      # (see app/version.py), which needs the tag ref actually present in
      # this checkout, not just assumed from GITHUB_REF_NAME.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # amd64 runners can't natively build arm64 without this — the Dockerfile
      # itself already branches on TARGETARCH (Buildx sets this automatically
      # per platform) to pull the matching humble-cli binary/checksum.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_REF_NAME is the tag itself (e.g. "v1.2.3") for a tag-triggered
      # run — stripping the leading "v" gives a plain semver tag (1.2.3) to
      # pair alongside the "v"-prefixed one, so either form works in a pull.
      #
      # :latest is included only when this tag is the highest vX.Y.Z tag that
      # exists right now (sort -V, real semver order — not push/finish
      # order), checked via a live `ls-remote` rather than this job's own
      # (possibly minutes-stale) checkout, and as late as possible before
      # the actual push. Pushing several release tags within a few minutes
      # of each other starts that many independent runs, and their build
      # times vary — real incident: six tags pushed within two minutes, and
      # the *oldest* one's run happened to finish last, so its unconditional
      # `:latest` push silently clobbered every newer image that had
      # already pushed :latest before it. Computing "am I the latest" fresh,
      # late, and from the remote means whichever run finishes last can
      # never downgrade :latest — an older tag's run just never attempts to
      # push it at all. Not airtight against every conceivable interleaving
      # (nothing short of a registry-side lock is), but it shrinks the race
      # window from "this run's entire build+push duration" to the moment
      # of this one check — pushing release tags back-to-back rather than
      # scattering them over many minutes is what keeps that window small.
      - name: Derive version tags
        id: version
        run: |
          echo "full=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "bare=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          highest=$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's#.*refs/tags/##' | sort -V | tail -n1)
          {
            echo "tags<<TAGS_EOF"
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
            if [ "${GITHUB_REF_NAME}" = "$highest" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
